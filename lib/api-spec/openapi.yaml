openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Blickling Fieldbook API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: observations
    description: Field observations
  - name: actions
    description: Follow-up actions
  - name: categories
    description: Observation categories
  - name: locations
    description: Named estate locations
  - name: users
    description: User management
  - name: notes
    description: Notes on observations and actions
  - name: dashboard
    description: Dashboard summary data
  - name: reports
    description: Management reports
  - name: storage
    description: File upload and object serving

security:
  - cookieAuth: []

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/setup-status:
    get:
      security: []
      operationId: getSetupStatus
      tags: [auth]
      summary: Check whether initial administrator setup is required
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /auth/setup:
    post:
      security: []
      operationId: completeSetup
      tags: [auth]
      summary: Complete the one-time secret-protected administrator setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Setup completed and administrator signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /auth/login:
    post:
      security: []
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed

  # Users
  /users/assignees:
    get:
      operationId: listAssignees
      tags: [users]
      summary: List active users available for action assignment
      responses:
        "200":
          description: Assignees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignee"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (administrator only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Categories
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List observation categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (administrator/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (administrator/manager)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  # Named Locations
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List named estate locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NamedLocation"

    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a named location (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedLocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedLocation"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update a named location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedLocationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedLocation"

  # Observations
  /observations:
    get:
      operationId: listObservations
      tags: [observations]
      summary: List observations with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: namedLocationId
          in: query
          schema:
            type: integer
        - name: assignedUserId
          in: query
          schema:
            type: integer
        - name: safetyIssue
          in: query
          schema:
            type: boolean
        - name: publicAccessAffected
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated observation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationList"

    post:
      operationId: createObservation
      tags: [observations]
      summary: Create a new observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"

  /observations/map:
    get:
      operationId: getObservationMapData
      tags: [observations]
      summary: Get lightweight observation data for map markers
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: namedLocationId
          in: query
          schema:
            type: integer
        - name: safetyIssue
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Map marker data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObservationMarker"

  /observations/{id}:
    get:
      operationId: getObservation
      tags: [observations]
      summary: Get full observation detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Observation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDetail"

    patch:
      operationId: updateObservation
      tags: [observations]
      summary: Update an observation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"

    delete:
      operationId: deleteObservation
      tags: [observations]
      summary: Delete an observation (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /observations/{id}/status:
    patch:
      operationId: updateObservationStatus
      tags: [observations]
      summary: Update observation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"

  # Actions
  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List all actions with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: assignedUserId
          in: query
          schema:
            type: integer
        - name: observationId
          in: query
          schema:
            type: integer
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated action list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionList"

    post:
      operationId: createAction
      tags: [actions]
      summary: Create a new assigned action (administrator/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/my:
    get:
      operationId: getMyActions
      tags: [actions]
      summary: Get actions assigned to current user, grouped by urgency
      responses:
        "200":
          description: My actions grouped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyActions"

  /actions/{id}:
    get:
      operationId: getAction
      tags: [actions]
      summary: Get action detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDetail"

    patch:
      operationId: updateAction
      tags: [actions]
      summary: Update an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  /actions/{id}/status:
    patch:
      operationId: updateActionStatus
      tags: [actions]
      summary: Update action status quickly
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"

  # Notes
  /notes:
    post:
      operationId: createNote
      tags: [notes]
      summary: Add a note to an observation or action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      summary: Get chart data for the dashboard
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCharts"

  # Reports
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get management summary for a date range
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

  /reports/export.csv:
    get:
      operationId: exportReportCsv
      tags: [reports]
      summary: Export observations for a date range as CSV
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string

  # Storage
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Unauthorized

  # Observation Images
  /observations/{id}/images:
    get:
      operationId: listObservationImages
      tags: [observations]
      summary: List images for an observation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObservationImage"
    post:
      operationId: addObservationImage
      tags: [observations]
      summary: Save image metadata after upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageInput"
      responses:
        "201":
          description: Image record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationImage"

  /observations/{id}/images/{imageId}:
    delete:
      operationId: deleteObservationImage
      tags: [observations]
      summary: Delete an observation image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Action Images
  /actions/{id}/images:
    get:
      operationId: listActionImages
      tags: [actions]
      summary: List images for an action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionImage"
    post:
      operationId: addActionImage
      tags: [actions]
      summary: Save action image metadata after upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageInput"
      responses:
        "201":
          description: Image record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionImage"

  /actions/{id}/images/{imageId}:
    delete:
      operationId: deleteActionImage
      tags: [actions]
      summary: Delete an action image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: blickling.sid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          maxLength: 128

    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean

    SetupInput:
      type: object
      required: [setupSecret, name, email, password]
      properties:
        setupSecret:
          type: string
          minLength: 24
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
        password:
          type: string
          minLength: 14
          maxLength: 128

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 14
          maxLength: 128

    AuthUser:
      type: object
      required: [id, name, email, role, propertyId, active, mustChangePassword]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, manager, team_member]
        propertyId:
          type: integer
        active:
          type: boolean
        mustChangePassword:
          type: boolean

    # Users
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, manager, team_member]
        active:
          type: boolean
        propertyId:
          type: integer
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]

    UserInput:
      type: object
      required: [name, email, role, password]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, manager, team_member]
        password:
          type: string
          minLength: 14
          maxLength: 128

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, manager, team_member]
        active:
          type: boolean
        password:
          type: string
          minLength: 14
          maxLength: 128

    Assignee:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [administrator, manager, team_member]

    # Categories
    Category:
      type: object
      required: [id, name, active, sortOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        displayColour:
          type: ["string", "null"]
        sortOrder:
          type: integer
        active:
          type: boolean
        propertyId:
          type: integer

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        displayColour:
          type: string
        sortOrder:
          type: integer

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        displayColour:
          type: ["string", "null"]
        sortOrder:
          type: integer
        active:
          type: boolean

    # Named Locations
    NamedLocation:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        active:
          type: boolean
        propertyId:
          type: integer

    NamedLocationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    NamedLocationUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        active:
          type: boolean

    # Observations
    Observation:
      type: object
      required: [id, referenceNumber, title, priority, status, createdAt, reportedByUserId, categoryId]
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        categoryColour:
          type: ["string", "null"]
        priority:
